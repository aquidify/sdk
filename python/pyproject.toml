[project]
name = "aquidify"
version = "0.2.0"
description = "Python client for the Aquidify API: turn what people type into validated, structured intent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://aquidify.com"
Source = "https://github.com/aquidify/sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquidify"]
