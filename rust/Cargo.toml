[package]
name = "aquidify"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Aquidify API: turn what people type into validated, structured intent."
license = "MIT"
homepage = "https://aquidify.com"
repository = "https://github.com/aquidify/sdk"
readme = "README.md"
keywords = ["aquidify", "intent", "nlp", "api", "sdk"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2", features = ["json"] }
